name: Probe Fork pre19
on:
  push:
    branches: [probe-fork-pre19]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fork:
    runs-on: ubuntu-latest
    steps:
      - name: Probe fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/midicn/pre19century/forks \
            -d '{"name":"pre19century"}')
          echo "HTTP $code"
          cat /tmp/out
